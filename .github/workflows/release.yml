name: release

# 打 tag（v*）即出 release：CI 构建 tarball 挂到 Release，
# NAS 容器一条 curl 管道解压安装（零现场构建、零包管理器依赖）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 固定 asset 名（不带版本），安装端 URL 永远 latest/download/dsh-web-search-tavily.tgz
      - run: npm pack && mv dsh-web-search-tavily-*.tgz dsh-web-search-tavily.tgz
      - name: 发布到 GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dsh-web-search-tavily.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
