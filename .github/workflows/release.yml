name: release

# 手动发版（节奏可控）：Actions → Run workflow → 输入版本号（如 v0.1.5）。
# CI 打 tag（幂等）+ 重建 release（幂等）+ 发布 npm。不监听 push tag——
# force-push/日常提交不会误触发发版。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发版版本号（如 v0.1.5）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # 固定 asset 名（不带版本），安装端 URL 永远 latest/download/dsh-web-search-tavily.tgz
      - run: npm run pack && mv *-*.tgz dsh-web-search-tavily.tgz
      - name: 打 tag（已存在则跳过，幂等）
        run: |
          if ! git rev-parse -q --verify "refs/tags/${{ inputs.version }}" >/dev/null; then
            git tag "${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi
      - name: 发布到 GitHub Release（已存在则删除重建，保证 tarball 最新）
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            gh release delete "${{ inputs.version }}" --yes
          fi
          gh release create "${{ inputs.version }}" dsh-web-search-tavily.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 发布到 npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
