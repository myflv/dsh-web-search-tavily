name: release

# 手动发版（节奏可控）：Actions → Run workflow → 输入版本号（如 v0.1.5）。
# CI 打 tag（幂等）+ 重建 release（幂等）+ 发布 npm。不监听 push tag——
# force-push/日常提交不会误触发发版。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发版版本号（如 v0.1.5）'
        required: true

permissions:
  contents: write
  id-token: write  # OIDC：npm Trusted Publishing（无需 NPM_TOKEN 长期凭证）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # npm ≥11.5.1（OIDC 前提）；registry-url 不设——空 token 会挡 OIDC 认证
          cache: npm
      - run: npm ci
      # 输入版本必须与 package.json version 一致（npm publish 发的是包版本）
      - name: 校验版本一致性
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "版本不一致：package.json=$PKG，输入=${{ inputs.version }}" >&2
            exit 1
          fi
      # 固定 asset 名（不带版本），安装端 URL 永远 latest/download/dsh-web-search-tavily.tgz
      - run: npm run pack && mv myflv-dsh-web-search-tavily-*.tgz dsh-web-search-tavily.tgz
      - name: 打 tag（已存在则跳过，幂等）
        run: |
          if ! git rev-parse -q --verify "refs/tags/${{ inputs.version }}" >/dev/null; then
            git tag "${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi
      - name: 发布到 GitHub Release（已存在则删除重建，保证 tarball 最新）
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            gh release delete "${{ inputs.version }}" --yes
          fi
          gh release create "${{ inputs.version }}" dsh-web-search-tavily.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 发布到 npm（Trusted Publishing + provenance 签名）
        run: npm publish --provenance --access public
